name: nihongo_manzil
description: "Minna no Nihongo asosidagi yapon tili o'rganish ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Lokal baza
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Audio (talaffuz uchun)
  just_audio: ^0.9.40

  # JSON serializatsiya
  json_annotation: ^4.9.0

  # Fayl tanlash (kontent import uchun)
  file_picker: ^8.0.0+1

  # UI yordamchilari
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/sample_data/

  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
