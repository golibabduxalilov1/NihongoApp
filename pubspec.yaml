name: nihongo_comet
description: "Minna no Nihongo asosidagi yapon tili o'rganish ilovasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Lokal baza
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Audio (talaffuz uchun)
  just_audio: ^0.9.40

  # Eshitish mashqi (Text-to-Speech) - so'zni ovoz chiqarib o'qish
  flutter_tts: ^4.2.0

  # JSON serializatsiya
  json_annotation: ^4.9.0

  # Fayl tanlash (kontent import uchun)
  file_picker: ^10.1.9

  # UI yordamchilari
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/sample_data/
    - assets/sample_data/lessons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
          weight: 800
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-VariableFont_wght.ttf
        - asset: assets/fonts/Baloo2-VariableFont_wght.ttf
          weight: 700
