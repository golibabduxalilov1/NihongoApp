name: Build and Release APK

# Bu workflow "v" bilan boshlanadigan har qanday tag push qilinganda ishga tushadi
# (masalan v1.0.0, v1.0.1, v2.0.0)
on:
  push:
    tags:
      - 'v*'

# Release'ga fayl biriktirish uchun yozish huquqi kerak
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Flutter SDK o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Java o'rnatish (Android build uchun kerak)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Paketlarni o'rnatish
        run: flutter pub get

      - name: Testlarni ishga tushirish
        run: flutter test

      - name: Release APK build qilish
        run: flutter build apk --release

      - name: APK'ni GitHub Release'ga biriktirish
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
